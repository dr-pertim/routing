name: Setup DNS (Custom Domain + Redirect)

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Domínio raiz do site (ex: drandrerufino.com.br) — sem www'
        required: true
        type: string

jobs:
  setup-dns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Get Zone ID
        id: zone
        run: |
          ZONE_ID=$(node scripts/get-zone-id.js)
          echo "zone_id=$ZONE_ID" >> $GITHUB_OUTPUT
          echo "✅ Zone ID: $ZONE_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DOMAIN: ${{ github.event.inputs.domain }}

      # Registra o www (e qualquer outro hostname que já esteja em
      # domains.json) como Custom Domain do Worker — a API já cria o DNS
      # record sozinha.
      - name: Register Custom Domain (www)
        run: node scripts/add-custom-domain.js
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}

      # Domínio raiz (sem www) NÃO passa pelo Worker — só redireciona pro
      # www, que é quem de fato mascara o site.
      - name: Setup redirect (raiz -> www)
        run: node scripts/setup-redirect.js
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
          APEX_DOMAIN: ${{ github.event.inputs.domain }}

      - name: ✅ Domínio configurado!
        run: echo "✅ www registrado no Worker + raiz redirecionando pro www"
