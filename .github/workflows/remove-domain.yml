name: Remove Custom Domain

on:
  workflow_dispatch:
    inputs:
      hostname:
        description: 'Hostname exato a remover (ex: drandrerufino.com.br)'
        required: true
        type: string

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Remove Custom Domain
        run: node scripts/remove-custom-domain.js
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HOSTNAME: ${{ github.event.inputs.hostname }}
